name: Build Desktop Apps

# ─────────────────────────────────────────────────────────────────────────────
# Builds the Ukuu HR Sync Bridge desktop app and attaches the installers to a
# GitHub Release so the landing page can always serve the LATEST version:
#
#   https://github.com/StackOne-Tec/ukuu-hr-csharp/releases/latest/download/UkuuHr-Windows-x64.exe
#   https://github.com/StackOne-Tec/ukuu-hr-csharp/releases/latest/download/UkuuHr-macOS-arm64.dmg
#
# On every v* tag push:
#   1. Windows job  — publishes a self-contained single-file .exe (win-x64)
#   2. macOS job    — publishes the arm64 binary, wraps in .app bundle,
#                     ad-hoc codesigns (prevents "damaged" Gatekeeper error),
#                     sets LSUIElement=true (background app, no Dock icon),
#                     then packages into a .dmg (hdiutil requires macOS runner)
#   3. Release job  — attaches both files to the GitHub Release.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1: Windows — self-contained single-file .exe ───────────────────────
  windows:
    name: Windows .exe (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x64 single-file exe
        run: |
          dotnet publish UkuuHr.Desktop/UkuuHr.Desktop.csproj -c Release -r win-x64 \
            --self-contained true -p:PublishSingleFile=true -o ./publish/windows
          # The app's product name is Ukuu HR — ship the exe as UkuuHr.exe
          mv ./publish/windows/UkuuHrSync.exe ./publish/windows/UkuuHr.exe

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ./publish/windows/UkuuHr.exe

  # ── Job 2: macOS — arm64 binary wrapped in a .dmg (needs a macOS runner) ───
  macos:
    name: macOS .dmg (arm64)
    runs-on: macos-14   # arm64 runner — publishes osx-arm64 natively
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish macOS arm64 single-file binary
        run: |
          dotnet publish UkuuHr.Desktop/UkuuHr.Desktop.csproj -c Release -r osx-arm64 \
            --self-contained true -p:PublishSingleFile=true -o ./publish/macos

      - name: Stage .dmg contents (proper .app bundle with brand icon)
        run: |
          APP=./dmg/UkuuHrSync.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp ./publish/macos/UkuuHrSync "$APP/Contents/MacOS/UkuuHrSync"
          chmod +x "$APP/Contents/MacOS/UkuuHrSync"
          # Brand mark .icns — shows as the app icon in Finder / Dock
          cp ./UkuuHr.Desktop/Ukuu_brand_mark.icns "$APP/Contents/Resources/UkuuHrSync.icns"

          # Write Info.plist (no leading whitespace — heredoc must be flush left)
          cat > "$APP/Contents/Info.plist" <<PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Ukuu HR Sync</string>
              <key>CFBundleDisplayName</key><string>Ukuu HR Sync</string>
              <key>CFBundleIdentifier</key><string>com.ukuuhr.syncbridge</string>
              <key>CFBundleVersion</key><string>1.3.1</string>
              <key>CFBundleShortVersionString</key><string>1.3.1</string>
              <key>CFBundleExecutable</key><string>UkuuHrSync</string>
              <key>CFBundleIconFile</key><string>UkuuHrSync</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>LSUIElement</key><true/>
          </dict>
          </plist>
          PLISTEOF

          # Write Applications symlink target folder
          mkdir -p ./dmg/Applications
          ln -s /Applications ./dmg/Applications

          # Write README
          cat > ./dmg/README.txt <<READMEEOF
          UKUU HR — SYNC BRIDGE v1.3.1

          Connects a Hikvision biometric terminal to the Ukuu HR cloud via ISAPI.

          INSTALL:
            Drag UkuuHrSync.app to the Applications folder.

          FIRST LAUNCH (macOS may block unsigned apps):
            Option A — Right-click UkuuHrSync.app → Open → click Open
            Option B — Terminal: xattr -cr /Applications/UkuuHrSync.app
            Then open the app normally.

          CONFIGURATION:
            On first launch, the app creates a default settings.json next to
            the app binary. Edit this file with your Hikvision device details:
              - deviceIp: your device's IP address
              - devicePort: port (default 80)
              - deviceUsername / devicePassword: device credentials
              - cloudUrl: Ukuu HR cloud URL (default https://ukuuhr.com)
              - apiKey: API key for cloud authentication
              - syncIntervalMinutes: how often to sync (default 5)

            Or run from Terminal for interactive setup:
              /Applications/UkuuHrSync.app/Contents/MacOS/UkuuHrSync

          COMMAND-LINE OPTIONS:
            UkuuHrSync                           interactive setup + continuous sync
            UkuuHrSync --once                    single sync, then exit
            UkuuHrSync --headless                non-interactive (requires settings.json)
            UkuuHrSync --config=settings.json    use a specific config file

          LOGS:
            The app writes logs to ukuu-sync.log next to the binary.
          READMEEOF

      - name: Ad-hoc codesign the .app bundle
        run: |
          # Ad-hoc sign (-s -) the app and all nested code (frameworks, dylibs).
          # This creates a valid local signature that prevents the macOS
          # "app is damaged and can't be opened" Gatekeeper error.
          # Without ANY signature, macOS rejects the app as damaged.
          # With ad-hoc signature, macOS shows the standard "unidentified developer"
          # dialog which the user can bypass with right-click → Open.
          codesign --force --deep -s - ./dmg/UkuuHrSync.app
          # Verify the signature
          codesign --verify --verbose ./dmg/UkuuHrSync.app 2>&1 || true
          echo "Ad-hoc codesign complete"

      - name: Create .dmg
        run: |
          hdiutil create -volname "Ukuu HR Sync" -srcfolder ./dmg \
            -ov -format UDZO UkuuHr-macOS-arm64.dmg

      - name: Ad-hoc codesign the .dmg
        run: |
          # Sign the DMG itself so macOS doesn't flag it as damaged
          codesign --force -s - UkuuHr-macOS-arm64.dmg
          codesign --verify --verbose UkuuHr-macOS-arm64.dmg 2>&1 || true
          echo "DMG codesign complete"

      - name: Verify .dmg
        run: hdiutil verify UkuuHr-macOS-arm64.dmg

      - name: Upload macOS dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ./UkuuHr-macOS-arm64.dmg

  # ── Job 3: Release — attach both binaries to the GitHub Release ────────────
  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./release

      - name: Download macOS dmg
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: ./release

      - name: Stage release files
        run: mv ./release/UkuuHr.exe ./release/UkuuHr-Windows-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ukuu HR Desktop ${{ github.ref_name }}
          body: |
            ## Downloads
            - **UkuuHr-Windows-x64.exe** — Windows 10+ (64-bit). Self-contained single-file executable — no .NET runtime needed. SmartScreen may warn on first run: click "More info" → "Run anyway".

            - **UkuuHr-macOS-arm64.dmg** — macOS 11+ (Apple Silicon). Ad-hoc signed disk image with `UkuuHrSync.app`.

            ### macOS Install
            1. Open the .dmg → drag **UkuuHrSync.app** to **Applications**
            2. First launch: **right-click** the app → **Open** → click **Open** again
               — or run `xattr -cr /Applications/UkuuHrSync.app` in Terminal
            3. On first run, a default `settings.json` is created — edit it with your Hikvision device details, then restart the app
            4. Or run from Terminal for interactive setup: `/Applications/UkuuHrSync.app/Contents/MacOS/UkuuHrSync`
            5. Subsequent launches work normally
          files: |
            ./release/UkuuHr-Windows-x64.exe
            ./release/UkuuHr-macOS-arm64.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
