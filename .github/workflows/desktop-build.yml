name: Build Desktop Apps

# ─────────────────────────────────────────────────────────────────────────────
# Builds the Ukuu HR Sync Bridge desktop app and attaches the installers to a
# GitHub Release so the landing page can always serve the LATEST version:
#
#   https://github.com/StackOne-Tec/ukuu-hr-csharp/releases/latest/download/UkuuHr-Windows-x64.exe
#   https://github.com/StackOne-Tec/ukuu-hr-csharp/releases/latest/download/UkuuHr-macOS-arm64.dmg
#
# On every v* tag push:
#   1. Windows job  — publishes a self-contained single-file .exe (win-x64)
#   2. macOS job    — publishes the arm64 binary and wraps it in a .dmg
#                     (hdiutil requires a real macOS runner)
#   3. Release job  — attaches UkuuHr-Windows-x64.exe + UkuuHr-macOS-arm64.dmg
#                     to the GitHub Release. GitHub's "releases/latest" then
#                     always resolves to this newest pair.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1: Windows — self-contained single-file .exe ───────────────────────
  windows:
    name: Windows .exe (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x64 single-file exe
        run: |
          dotnet publish UkuuHr.Desktop/UkuuHr.Desktop.csproj -c Release -r win-x64 \
            --self-contained true -p:PublishSingleFile=true -o ./publish/windows
          # The app's product name is Ukuu HR — ship the exe as UkuuHr.exe
          mv ./publish/windows/UkuuHrSync.exe ./publish/windows/UkuuHr.exe

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ./publish/windows/UkuuHr.exe

  # ── Job 2: macOS — arm64 binary wrapped in a .dmg (needs a macOS runner) ───
  macos:
    name: macOS .dmg (arm64)
    runs-on: macos-14   # arm64 runner — publishes osx-arm64 natively
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish macOS arm64 single-file binary
        run: |
          dotnet publish UkuuHr.Desktop/UkuuHr.Desktop.csproj -c Release -r osx-arm64 \
            --self-contained true -p:PublishSingleFile=true -o ./publish/macos

      - name: Stage .dmg contents (proper .app bundle with brand icon)
        run: |
          APP=./dmg/UkuuHrSync.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp ./publish/macos/UkuuHrSync "$APP/Contents/MacOS/UkuuHrSync"
          chmod +x "$APP/Contents/MacOS/UkuuHrSync"
          # Brand mark .icns — shows as the app icon in Finder / Dock
          cp ./UkuuHr.Desktop/Ukuu_brand_mark.icns "$APP/Contents/Resources/UkuuHrSync.icns"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Ukuu HR Sync</string>
              <key>CFBundleDisplayName</key><string>Ukuu HR Sync</string>
              <key>CFBundleIdentifier</key><string>com.ukuuhr.syncbridge</string>
              <key>CFBundleVersion</key><string>1.3.0</string>
              <key>CFBundleShortVersionString</key><string>1.3.0</string>
              <key>CFBundleExecutable</key><string>UkuuHrSync</string>
              <key>CFBundleIconFile</key><string>UkuuHrSync</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          cat > ./dmg/README.txt <<'EOF'
          UKUU HR — SYNC BRIDGE v1.3.0

          Connects a Hikvision biometric terminal to the Ukuu HR cloud via ISAPI.

          Usage:
            Open UkuuHrSync.app — interactive first-time setup, then auto-sync

          Command-line options (from a Terminal):
            UkuuHrSync --once                     single sync, then exit
            UkuuHrSync --config=settings.json     use a saved config file

          Notes:
            - Settings are stored in settings.json next to the app.
            - Unsigned build: if macOS blocks it, right-click the app -> Open,
              or run: xattr -dr com.apple.quarantine UkuuHrSync.app
          EOF

      - name: Create .dmg
        run: |
          hdiutil create -volname "Ukuu HR Sync" -srcfolder ./dmg \
            -ov -format UDZO UkuuHr-macOS-arm64.dmg

      - name: Verify .dmg
        run: hdiutil verify UkuuHr-macOS-arm64.dmg

      - name: Upload macOS dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ./UkuuHr-macOS-arm64.dmg

  # ── Job 3: Release — attach both binaries to the GitHub Release ────────────
  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./release

      - name: Download macOS dmg
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: ./release

      - name: Stage release files
        run: mv ./release/UkuuHr.exe ./release/UkuuHr-Windows-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ukuu HR Desktop ${{ github.ref_name }}
          body: |
            ## Downloads
            - **UkuuHr-Windows-x64.exe** — Windows 10+ (64-bit). Self-contained single-file executable — no .NET runtime needed. Run `UkuuHr.exe` for first-time setup.
            - **UkuuHr-macOS-arm64.dmg** — macOS 11+ (Apple Silicon). Disk image containing the `UkuuHrSync` binary. Unsigned build — right-click → Open on first launch.
          files: |
            ./release/UkuuHr-Windows-x64.exe
            ./release/UkuuHr-macOS-arm64.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
