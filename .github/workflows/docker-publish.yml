name: Build, Test & Publish Docker Image

# ─────────────────────────────────────────────────────────────────────────────
# CI + CD pipeline for Ukuu HR.
#
# On every push to main (or a version tag v*.*.*):
#   1. Restores NuGet packages
#   2. Builds the solution in Release mode
#   3. Runs the xUnit test suite (81 tests)
#   4. Builds a Docker image using the repo's Dockerfile
#   5. Pushes the image to GitHub Container Registry (ghcr.io)
#
# Image tags produced:
#   - latest                       — always, on main branch
#   - <short-sha>                  — always (e.g. abc1234)
#   - v1.2.3                       — when a v*.*.* tag is pushed
#   - pr-<number>                  — on pull requests (for testing, not latest)
#
# Image URL: ghcr.io/stackone-tec/ukuu-hr-csharp
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  # security-events: write   # enable if you add CodeQL later
  id-token: write             # for OIDC if you add cloud deploys later

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Build & test the .NET solution
  # ───────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.meta.outputs.short-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'

      - name: Restore
        run: |
          dotnet restore UkuuHr.Web/UkuuHr.Web.csproj
          dotnet restore UkuuHr.Desktop/UkuuHr.Desktop.csproj
          dotnet restore UkuuHr.Tests/UkuuHr.Tests.csproj

      - name: Build
        run: |
          dotnet build UkuuHr.Web/UkuuHr.Web.csproj -c Release --no-restore
          dotnet build UkuuHr.Desktop/UkuuHr.Desktop.csproj -c Release --no-restore
          dotnet build UkuuHr.Tests/UkuuHr.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test UkuuHr.Tests/UkuuHr.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate metadata
        id: meta
        run: |
          echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Build & push Docker image to ghcr.io
  # Only runs on main branch pushes, version tags, or manual dispatch.
  # Skipped on PRs (we don't want to publish every fork's PR).
  # ───────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Build & Push Docker Image to ghcr.io
    needs: build-test
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build-test.result != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Ukuu HR
            org.opencontainers.image.description=Modern HRMS for Africa — Blazor Server + .NET 10
            org.opencontainers.image.source=https://github.com/StackOne-Tec/ukuu-hr-csharp
            org.opencontainers.image.licenses=MIT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            BUILD_DATE=${{ needs.build-test.outputs.build-date }}
            GIT_SHA=${{ github.sha }}

      # ───── Visibility note ─────
      # Packages pushed by GITHUB_TOKEN default to private. The GitHub REST API
      # for changing package visibility returns 404 for bot-pushed packages
      # (confirmed limitation — both /orgs/ and /user/ endpoints fail even when
      # called by an org admin PAT). The package must be made public manually
      # via the web UI, ONE TIME ONLY:
      #
      #   https://github.com/orgs/StackOne-Tec/packages/container/ukuu-hr-csharp/settings
      #
      # → Danger Zone → Change visibility → Public
      #
      # After that one-time change, all future pushes (new latest tags) inherit
      # the public visibility automatically.
      - name: Print pull command
        run: |
          echo ""
          echo "✅ Docker image published successfully!"
          echo ""
          echo "Pull it with:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "Run it with:"
          echo "  docker run --rm -p 8080:8080 \\"
          echo "    -e ASPNETCORE_ENVIRONMENT=Production \\"
          echo "    -e SEED_DEMO_DATA=true \\"
          echo "    -e POSTGRES_CONNECTION_STRING='Host=...;Database=ukuuhr;...' \\"
          echo "    -e UKUU_ENCRYPTION_KEY=\$(openssl rand -hex 32) \\"
          echo "    -e UKUU_API_KEY=\$(openssl rand -hex 32) \\"
          echo "    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "    -e UKUU_ADMIN_PASSWORD=<your-secure-password> \\"
