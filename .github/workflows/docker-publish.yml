name: Build, Test & Publish Docker Image

# ─────────────────────────────────────────────────────────────────────────────
# CI + CD pipeline for Ukuu HR.
#
# On every push to main (or a version tag v*.*.*):
#   1. Builds & pushes a Docker image using the repo's Dockerfile (primary)
#   2. Runs .NET build & test as best-effort (allowed to fail)
#
# Image URL: ghcr.io/stackone-tec/ukuu-hr-csharp
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Build & push Docker image (primary — this is what deploys)
  # ───────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Build & Push Docker Image to ghcr.io
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Ukuu HR
            org.opencontainers.image.description=Modern HRMS for Africa — Blazor Server + .NET 10
            org.opencontainers.image.source=https://github.com/StackOne-Tec/ukuu-hr-csharp
            org.opencontainers.image.licenses=MIT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Print pull command
        run: |
          echo ""
          echo "Docker image published successfully!"
          echo ""
          echo "Pull it with:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Build & test the .NET solution (best-effort, allowed to fail)
  # The Docker image (above) is the authoritative build.
  # ───────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'

      - name: Restore
        run: dotnet restore UkuuHr.sln

      - name: Build
        run: dotnet build UkuuHr.sln -c Release --no-restore

      - name: Test
        run: dotnet test UkuuHr.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 14
