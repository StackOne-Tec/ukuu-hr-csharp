      <g opacity="0.11"><rect x="126" y="870" width="1668" height="66" rx="21" fill="#25163F" stroke="none" /><text x="591.78" y="911" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#F7F2FF" text-anchor="start" letter-spacing="0" >A trustworthy record is more than a timestamp — it is the context around it.</text></g></svg>